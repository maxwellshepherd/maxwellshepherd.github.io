  // trend lines first (recessive)
  [MAX,ALEX].forEach(n=>{ const S=DATA.series[n];
    const ya=S.slope*xmin+S.intercept, yb=S.slope*xmax+S.intercept;
    s+=`<line x1="${X(xmin)}" y1="${Y(ya)}" x2="${X(xmax)}" y2="${Y(yb)}" stroke="${COL[n]}" stroke-width="2" opacity="0.3" stroke-linecap="round"/>`;});
  // data lines
  [MAX,ALEX].forEach(n=>{ const pts=DATA.series[n].points;
    s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+X(p.x)+' '+Y(p.y)).join(' ')}" fill="none" stroke="${COL[n]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;});
  // dots
  [MAX,ALEX].forEach(n=>{ DATA.series[n].points.forEach(p=>{
    s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${COL[n]}" stroke="var(--surface-1)" stroke-width="2"/>`;});});
  // endpoint direct labels
  { const pm=DATA.series[MAX].points, pa=DATA.series[ALEX].points;
    const m=pm[pm.length-1], a=pa[pa.length-1];
    const [ym,ya]=sep(Y(m.y),Y(a.y),36);
    [[MAX,m,ym],[ALEX,a,ya]].forEach(([n,p,yy])=>{
      s+=`<circle cx="${X(p.x)+16}" cy="${yy-4}" r="4" fill="${COL[n]}"/>
        <text class="axlab" x="${X(p.x)+26}" y="${yy-9}" fill="var(--text-primary)" style="font-weight:640">${n.split(' ')[0]}</text>
        <text class="axlab" x="${X(p.x)+26}" y="${yy+7}">${p.y} · last round</text>`;}); }
  // trend annotations
  const sm=DATA.series[MAX], sa=DATA.series[ALEX];
  s+=`<text class="axlab" x="${X(xmin)+10}" y="${Y(sm.slope*xmin+sm.intercept)-10}" fill="var(--text-secondary)">${sm.slope_per_month.toFixed(1)} pts/month</text>`;
  s+=`<text class="axlab" x="${X(xmin)+10}" y="${Y(sa.slope*xmin+sa.intercept)+20}" fill="var(--text-secondary)">+${sa.slope_per_month.toFixed(1)} pts/month</text>`;
  // hover columns
  const dates=[...new Set(all.map(p=>p.d))].sort();
  dates.forEach(d=>{ const x=X(byDate[d]);
    const mp=DATA.series[MAX].points.find(p=>p.d===d), ap=DATA.series[ALEX].points.find(p=>p.d===d);
    const html=`<div class="th">${fmtD(d)} 2026</div>`+
      (mp?tipRow(C1,'Maxwell',mp.y+'  ('+mp.x_ct+'X)'):'')+(ap?tipRow(C2,'Alex',ap.y+'  ('+ap.x_ct+'X)'):'')+
      ((mp&&ap)?tipRow('','margin',(mp.y-ap.y>0?'+':'')+(mp.y-ap.y)):'');
    s+=`<rect x="${x-14}" y="${P.t}" width="28" height="${ih}" fill="transparent" data-tip="${esc(html).replace(/"/g,'&quot;')}"/>`;});
  s+=`<text class="axlab" x="${-(P.t+ih/2)}" y="14" transform="rotate(-90)" text-anchor="middle">Score / 300</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vegas 300 scores over time for Maxwell Shepherd and Alex Grossman">${s}</svg>`;
  // table
  let rows=dates.map(d=>{const mp=DATA.series[MAX].points.find(p=>p.d===d),ap=DATA.series[ALEX].points.find(p=>p.d===d);
    return `<tr><td>${fmtD(d)}</td><td class="hl">${mp?mp.y:'—'}</td><td>${mp?mp.x_ct:'—'}</td><td class="hl">${ap?ap.y:'—'}</td><td>${ap?ap.x_ct:'—'}</td></tr>`;}).join('');
  const table=`<table><thead><tr><th>Date</th><th>Maxwell</th><th>X</th><th>Alex</th><th>X</th></tr></thead><tbody>${rows}</tbody></table>`;
  return figure('Every scored round, April → August 2026',
    'Each dot is one 30-arrow Vegas round. Faint straight lines are least-squares trends.',
    [{c:C1,l:'Maxwell Shepherd'},{c:C2,l:'Alex Grossman'},{c:'var(--text-muted)',l:'faded line = fitted trend',op:.4}],
    svg,
    'The two trends cross in <b>late June</b>. Both slopes are significant at p&nbsp;&asymp;&nbsp;0.05 (Maxwell R²&nbsp;0.36, Alex R²&nbsp;0.37).',
    table);
}

/* ---------- 2. ROLLING FORM ---------- */
function chartRolling(){
  const W=940,H=300,P={t:16,r:112,b:40,l:48}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const ser={}; [MAX,ALEX].forEach(n=>ser[n]=DATA.rolling[n].filter(p=>p.y!==null));
  const dates=[...new Set([...DATA.rolling[MAX],...DATA.rolling[ALEX]].map(p=>p.d))].sort();
  const xi=d=>dates.indexOf(d);
  const y0=180,y1=260;
  const X=i=>P.l+i/(dates.length-1)*iw, Y=y=>P.t+(1-(y-y0)/(y1-y0))*ih;
  let s='';
  for(let y=y0;y<=y1;y+=20) s+=`<line x1="${P.l}" y1="${Y(y)}" x2="${P.l+iw}" y2="${Y(y)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${P.l-10}" y="${Y(y)+4}" text-anchor="end">${y}</text>`;
  s+=`<line x1="${P.l}" y1="${P.t+ih}" x2="${P.l+iw}" y2="${P.t+ih}" stroke="var(--grid)" stroke-width="1"/>`;
  dates.forEach((d,i)=>{ if(i%2===0) s+=`<text class="ax" x="${X(i)}" y="${P.t+ih+22}" text-anchor="middle">${fmtD(d)}</text>`;});
  [MAX,ALEX].forEach(n=>{ const p=ser[n];
    s+=`<path d="${p.map((q,i)=>(i?'L':'M')+X(xi(q.d))+' '+Y(q.y)).join(' ')}" fill="none" stroke="${COL[n]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    p.forEach(q=>s+=`<circle cx="${X(xi(q.d))}" cy="${Y(q.y)}" r="4.5" fill="${COL[n]}" stroke="var(--surface-1)" stroke-width="2"/>`);});
  { const lm=ser[MAX][ser[MAX].length-1], la=ser[ALEX][ser[ALEX].length-1];
    const [ym,ya]=sep(Y(lm.y),Y(la.y),36);
    [[MAX,lm,ym],[ALEX,la,ya]].forEach(([n,last,yy])=>{
      s+=`<circle cx="${X(xi(last.d))+16}" cy="${yy-4}" r="4" fill="${COL[n]}"/>
        <text class="axlab" x="${X(xi(last.d))+26}" y="${yy-9}" fill="var(--text-primary)" style="font-weight:640">${n.split(' ')[0]}</text>
        <text class="axlab" x="${X(xi(last.d))+26}" y="${yy+7}">${last.y.toFixed(1)}</text>`;}); }
  dates.forEach((d,i)=>{ const m=ser[MAX].find(p=>p.d===d), a=ser[ALEX].find(p=>p.d===d);
    if(!m&&!a) return;
    const html=`<div class="th">3-round avg to ${fmtD(d)}</div>`+(m?tipRow(C1,'Maxwell',m.y.toFixed(1)):'')+(a?tipRow(C2,'Alex',a.y.toFixed(1)):'');
    s+=`<rect x="${X(i)-16}" y="${P.t}" width="32" height="${ih}" fill="transparent" data-tip="${esc(html).replace(/"/g,'&quot;')}"/>`;});
  s+=`<text class="axlab" x="${-(P.t+ih/2)}" y="14" transform="rotate(-90)" text-anchor="middle">3-round avg</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rolling three-round average">${s}</svg>`;
  let rows=dates.map(d=>{const m=ser[MAX].find(p=>p.d===d),a=ser[ALEX].find(p=>p.d===d);
    return `<tr><td>${fmtD(d)}</td><td class="hl">${m?m.y.toFixed(1):'—'}</td><td class="hl">${a?a.y.toFixed(1):'—'}</td></tr>`;}).join('');
  return figure('Rolling 3-round form','Smooths out single bad days. Lines cross in early July.',
    [{c:C1,l:'Maxwell Shepherd'},{c:C2,l:'Alex Grossman'}], svg,
    'Maxwell peaks at <b>240.3</b> (26 Apr) and bottoms at <b>196.0</b> (9 Aug). Alex climbs almost monotonically from <b>200.0</b> to <b>250.3</b>.',
    `<table><thead><tr><th>Through</th><th>Maxwell</th><th>Alex</th></tr></thead><tbody>${rows}</tbody></table>`);
}

/* ---------- 3. HEAD TO HEAD MARGIN ---------- */
function chartH2H(){
  const d=DATA.h2h, W=940,H=300,P={t:26,r:24,b:52,l:56}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const M=80, band=iw/d.length, bw=Math.min(24,band-14);
  const X=i=>P.l+band*i+band/2, Y=v=>P.t+ih/2-(v/M)*(ih/2);
  let s='';
  for(let v=-80;v<=80;v+=40) s+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+iw}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${P.l-10}" y="${Y(v)+4}" text-anchor="end">${v>0?'+':''}${v}</text>`;
  s+=`<line x1="${P.l}" y1="${Y(0)}" x2="${P.l+iw}" y2="${Y(0)}" stroke="var(--text-muted)" stroke-width="1"/>`;
  d.forEach((r,i)=>{
    const up=r.diff>0, c=up?C1:C2, h=Math.abs(Y(r.diff)-Y(0));
    const y=up?Y(r.diff):Y(0)+1;   // 2px surface gap at the zero line
    const hh=Math.max(h-1,1);
    // rounded data-end away from baseline, square at baseline
    const rr=4;
    const path = up
      ? `M${X(i)-bw/2} ${y+hh} L${X(i)-bw/2} ${y+rr} Q${X(i)-bw/2} ${y} ${X(i)-bw/2+rr} ${y} L${X(i)+bw/2-rr} ${y} Q${X(i)+bw/2} ${y} ${X(i)+bw/2} ${y+rr} L${X(i)+bw/2} ${y+hh} Z`
      : `M${X(i)-bw/2} ${y} L${X(i)-bw/2} ${y+hh-rr} Q${X(i)-bw/2} ${y+hh} ${X(i)-bw/2+rr} ${y+hh} L${X(i)+bw/2-rr} ${y+hh} Q${X(i)+bw/2} ${y+hh} ${X(i)+bw/2} ${y+hh-rr} L${X(i)+bw/2} ${y} Z`;
    const html=`<div class="th">${fmtD(r.d)} 2026</div>${tipRow(C1,'Maxwell',r.max)}${tipRow(C2,'Alex',r.alex)}${tipRow('','margin',(r.diff>0?'+':'')+r.diff)}`;
    s+=`<path d="${path}" fill="${c}" data-tip="${esc(html).replace(/"/g,'&quot;')}"/>`;
    s+=`<text class="axlab" x="${X(i)}" y="${up?Y(r.diff)-8:Y(r.diff)+16}" text-anchor="middle" fill="var(--text-primary)" style="font-weight:600">${r.diff>0?'+':''}${r.diff}</text>`;
    s+=`<text class="ax" x="${X(i)}" y="${P.t+ih+22}" text-anchor="middle">${fmtD(r.d)}</text>`;});
  s+=`<text class="axlab" x="${P.l+4}" y="${P.t-8}">Maxwell ahead &#9650;</text>`;
  s+=`<text class="axlab" x="${P.l+4}" y="${P.t+ih+44}">Alex ahead &#9660;</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Head to head margin per shared event">${s}</svg>`;
  const rows=d.map(r=>`<tr><td>${fmtD(r.d)}</td><td class="hl">${r.max}</td><td class="hl">${r.alex}</td><td>${r.diff>0?'+':''}${r.diff}</td></tr>`).join('');
  return figure('Head-to-head margin, 9 shared events','Bar height = Maxwell&rsquo;s score minus Alex&rsquo;s on the same day, same round, same conditions.',
    [{c:C1,l:'Maxwell ahead'},{c:C2,l:'Alex ahead'}], svg,
    'Maxwell won the first three meetings by an average of <b>+39</b>; Alex has won <b>4 of the last 5</b> by an average of <b>45</b>. Season record 4&ndash;5. Across all 9, the paired difference is <b>not</b> significant (p&nbsp;=&nbsp;0.69) &mdash; the reversal, not the average, is the story.',
    `<table><thead><tr><th>Date</th><th>Maxwell</th><th>Alex</th><th>Margin</th></tr></thead><tbody>${rows}</tbody></table>`);
}

/* ---------- 4. WITHIN-END SPREAD (consistency) ---------- */
function chartSpread(){
  const W=940,H=290,P={t:16,r:112,b:40,l:52}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const dates=[...new Set([...DATA.spread[MAX],...DATA.spread[ALEX]].map(p=>p.d))].sort();
  const xi=d=>dates.indexOf(d);
  const y0=1,y1=5, X=i=>P.l+i/(dates.length-1)*iw, Y=y=>P.t+(1-(y-y0)/(y1-y0))*ih;
  let s='';
  for(let y=1;y<=5;y+=1) s+=`<line x1="${P.l}" y1="${Y(y)}" x2="${P.l+iw}" y2="${Y(y)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${P.l-10}" y="${Y(y)+4}" text-anchor="end">${y}</text>`;
  s+=`<line x1="${P.l}" y1="${P.t+ih}" x2="${P.l+iw}" y2="${P.t+ih}" stroke="var(--grid)" stroke-width="1"/>`;
  dates.forEach((d,i)=>{ if(i%2===0) s+=`<text class="ax" x="${X(i)}" y="${P.t+ih+22}" text-anchor="middle">${fmtD(d)}</text>`;});
  [MAX,ALEX].forEach(n=>{ const p=DATA.spread[n];
    s+=`<path d="${p.map((q,i)=>(i?'L':'M')+X(xi(q.d))+' '+Y(q.y)).join(' ')}" fill="none" stroke="${COL[n]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    p.forEach(q=>s+=`<circle cx="${X(xi(q.d))}" cy="${Y(q.y)}" r="4.5" fill="${COL[n]}" stroke="var(--surface-1)" stroke-width="2"/>`);});
  { const lm=DATA.spread[MAX][DATA.spread[MAX].length-1], la=DATA.spread[ALEX][DATA.spread[ALEX].length-1];
    const [ym,ya]=sep(Y(lm.y),Y(la.y),36);
    [[MAX,lm,ym],[ALEX,la,ya]].forEach(([n,last,yy])=>{
      s+=`<circle cx="${X(xi(last.d))+16}" cy="${yy-4}" r="4" fill="${COL[n]}"/>
        <text class="axlab" x="${X(xi(last.d))+26}" y="${yy-9}" fill="var(--text-primary)" style="font-weight:640">${n.split(' ')[0]}</text>
        <text class="axlab" x="${X(xi(last.d))+26}" y="${yy+7}">${last.y.toFixed(1)} pts</text>`;}); }
  dates.forEach((d,i)=>{ const m=DATA.spread[MAX].find(p=>p.d===d), a=DATA.spread[ALEX].find(p=>p.d===d);
    if(!m&&!a) return;
    const html=`<div class="th">${fmtD(d)} 2026</div>`+(m?tipRow(C1,'Maxwell',m.y.toFixed(2)+' pts'):'')+(a?tipRow(C2,'Alex',a.y.toFixed(2)+' pts'):'');
    s+=`<rect x="${X(i)-16}" y="${P.t}" width="32" height="${ih}" fill="transparent" data-tip="${esc(html).replace(/"/g,'&quot;')}"/>`;});
  s+=`<text class="axlab" x="${-(P.t+ih/2)}" y="14" transform="rotate(-90)" text-anchor="middle">Avg spread (pts)</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Within-end arrow spread over time">${s}</svg>`;
  const rows=dates.map(d=>{const m=DATA.spread[MAX].find(p=>p.d===d),a=DATA.spread[ALEX].find(p=>p.d===d);
    return `<tr><td>${fmtD(d)}</td><td class="hl">${m?m.y.toFixed(2):'—'}</td><td class="hl">${a?a.y.toFixed(2):'—'}</td></tr>`;}).join('');
  return figure('Group consistency — average spread within an end (lower is better)',
    'Best arrow minus worst arrow, averaged over the 10 ends of each round. A proxy for group size, independent of where the group is centred.',
    [{c:C1,l:'Maxwell Shepherd'},{c:C2,l:'Alex Grossman'}], svg,
    'Alex&rsquo;s groups tighten from <b>3.1</b> to <b>1.5&ndash;2.5</b> points; Maxwell&rsquo;s loosen from <b>2.3</b> to <b>3.0&ndash;4.9</b>. Season means: Alex <b>2.55</b>, Maxwell <b>3.14</b>. This is the mechanism behind the score curves &mdash; the scores follow the groups.',
    `<table><thead><tr><th>Date</th><th>Maxwell</th><th>Alex</th></tr></thead><tbody>${rows}</tbody></table>`);
}

/* ---------- 5. ARROW VALUE DISTRIBUTION ---------- */
function chartDist(){
  const L=DATA.dist.labels, W=940,H=300,P={t:18,r:24,b:52,l:48}, iw=W-P.l-P.r, ih=H-P.t-P.b;
  const mx=30, band=iw/L.length, bw=Math.min(18,(band-8)/2-1);
  const X=i=>P.l+band*i+band/2, Y=v=>P.t+ih-(v/mx)*ih;
  let s='';
  for(let v=0;v<=30;v+=10) s+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+iw}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/><text class="ax" x="${P.l-10}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`;
  s+=`<line x1="${P.l}" y1="${Y(0)}" x2="${P.l+iw}" y2="${Y(0)}" stroke="var(--grid)" stroke-width="1"/>`;
  const rr=4;
  L.forEach((lab,i)=>{
    [[MAX,-1],[ALEX,1]].forEach(([n,side])=>{
      const v=DATA.dist.series[n][i]; if(v<=0){return;}
      const h=Math.max((v/mx)*ih,1.5), x=X(i)+side*(bw/2+1), x0=x-bw/2, y=Y(v);
      const path=`M${x0} ${Y(0)} L${x0} ${y+rr} Q${x0} ${y} ${x0+rr} ${y} L${x0+bw-rr} ${y} Q${x0+bw} ${y} ${x0+bw} ${y+rr} L${x0+bw} ${Y(0)} Z`;
      const html=`<div class="th">Arrow value: ${lab}</div>${tipRow(COL[n],n.split(' ')[0],v.toFixed(1)+'% of arrows')}`;
      s+=`<path d="${path}" fill="${COL[n]}" data-tip="${esc(html).replace(/"/g,'&quot;')}"/>`;});
    s+=`<text class="ax" x="${X(i)}" y="${Y(0)+22}" text-anchor="middle">${lab}</text>`;});
  s+=`<text class="axlab" x="${P.l+iw/2}" y="${Y(0)+44}" text-anchor="middle">Arrow value (M = miss, X = inner 10)</text>`;
  s+=`<text class="axlab" x="${-(P.t+ih/2)}" y="14" transform="rotate(-90)" text-anchor="middle">% of arrows</text>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of arrow values">${s}</svg>`;
  const rows=L.map((lab,i)=>`<tr><td>${lab}</td><td class="hl">${DATA.dist.series[MAX][i].toFixed(1)}%</td><td class="hl">${DATA.dist.series[ALEX][i].toFixed(1)}%</td></tr>`).join('');
  return figure('Where every arrow landed — 330 arrows each',
    'The full season, arrow by arrow. Same class, same round, same targets.',
    [{c:C1,l:'Maxwell Shepherd'},{c:C2,l:'Alex Grossman'}], svg,
    'Alex hits the <b>X-ring 5.5%</b> of the time vs Maxwell&rsquo;s <b>3.3%</b>, and the 8-or-better band <b>61.3%</b> vs <b>51.2%</b>. Maxwell has <b>6 misses</b>; Alex has <b>none</b>. Alex&rsquo;s edge is not one big shot &mdash; it is the whole distribution shifted right.',
    `<table><thead><tr><th>Value</th><th>Maxwell</th><th>Alex</th></tr></thead><tbody>${rows}</tbody></table>`);
}

/* ---------- TILES ---------- */
function tiles(){
  const m=DATA.series[MAX], a=DATA.series[ALEX];
  const t=(dot,k,v,n)=>`<div class="tile"><div class="k">${dot?`<span class="dot" style="background:${dot}"></span>`:''}${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
  return `<div class="tiles">
    ${t(C1,'Maxwell — trend','−7.3','pts/month · 239 → 205 avg')}
    ${t(C2,'Alex — trend','+8.7','pts/month · 200 → 249 avg')}
    ${t('','Head-to-head','4–5','Maxwell won first 3, Alex won 4 of last 5')}
    ${t('','Season best','252 / 251','Maxwell 12 Apr · Alex 2 Aug')}
  </div>`;
}

app.innerHTML = tiles()
  + `<h2 class="sec">The season</h2>` + chartScores() + chartRolling() + chartH2H()
  + `<h2 class="sec">Why</h2>` + chartSpread() + chartDist();

/* ---------- hover wiring ---------- */
document.addEventListener('mousemove', e=>{
  const el=e.target.closest('[data-tip]');
  if(el) showTip(el.getAttribute('data-tip'), e); else hideTip();
});
document.addEventListener('mouseleave', hideTip);
</script>
</body>
